
name: CI with AWS SES Email (OIDC)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::459547397313:role/GitHubActionsSesSenderRole
          aws-region: us-east-1

      # Step 2: Verify AWS authentication
      - name: Verify AWS Authentication
        run: |
          aws sts get-caller-identity

      # Step 3: Build process
      - name: Run build
        run: |
          echo "Simulating a build process..."

      # Step 4: Send success email
      - name: Send Email Notification (on success)
        if: success()
        run: |
          aws ses send-email \
            --from 'vaisakkdev@gmail.com' \
            --destination 'ToAddresses=vaisak921@gmail.com' \
            --message 'Subject={Data="Build Success - ${{ github.repository }}"},Body={Text={Data="Build for ${{ github.repository }} on branch ${{ github.ref_name }} was successful! Commit: ${{ github.sha }} Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}' \
            --region us-east-1

      # Step 5: Send failure email only if AWS authentication succeeded
      - name: Send Email Notification (on failure)
        if: failure() && steps.aws_credentials.outcome == 'success'
        run: |
          aws ses send-email \
            --from 'vaisakkdev@gmail.com' \
            --destination 'ToAddresses=vaisak921@gmail.com' \
            --message 'Subject={Data="Build FAILED - ${{ github.repository }}"},Body={Text={Data="ALERT: Build for ${{ github.repository }} on branch ${{ github.ref_name }} FAILED! Commit: ${{ github.sha }} Please review logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}' \
            --region us-east-1
