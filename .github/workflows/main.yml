
name: Maven CI/CD Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:

    runs-on: demo-runner

    steps:

      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Step 3: Build application
      - name: Maven Build
        run: mvn clean compile

      # Step 4: Run unit tests
      - name: Maven Test
        run: mvn test

      # Step 5: Package application
      - name: Maven Package
        run: mvn package

      # Step 6: Deploy to GitHub Packages
      - name: Deploy to GitHub Packages
        run: mvn deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
